name: documentation-and-publication-hygiene

on:
  push:
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n bin/usbclone scripts/ensure-dummy-hcd install.sh uninstall.sh
      - name: Reject private/runtime image formats
        shell: bash
        run: |
          set -euo pipefail
          bad="$(find . -type f \( -iname '*.img' -o -iname '*.raw' -o -iname '*.iso' -o -iname '*.vhd' -o -iname '*.vhdx' -o -iname '*.qcow2' \) -print)"
          test -z "$bad" || { echo "$bad"; exit 1; }
      - name: Reject workstation-private values in runtime material
        shell: bash
        run: |
          set -euo pipefail
          targets=(bin scripts install.sh uninstall.sh systemd examples)
          if grep -RInE '/home/aag-linux|/mnt/data/USB Clone|kingston-empty' "${targets[@]}" 2>/dev/null; then
            echo 'Private/workstation-specific value found in runtime material.'
            exit 1
          fi
      - name: Synthetic example identity policy
        shell: bash
        run: |
          set -euo pipefail
          hits="$(grep -RIn 'SERIAL=' examples 2>/dev/null || true)"
          bad="$(printf '%s\n' "$hits" | grep -vE 'SERIAL=(EXAMPLE|SYNTHETIC)' || true)"
          test -z "$bad" || { echo "$bad"; exit 1; }
      - name: Required documentation
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s docs/HANDOFF.md
          test -s docs/ARCHITECTURE.md
          test -s docs/INSTALLATION.md
          test -s docs/TESTING.md
          test -s docs/TROUBLESHOOTING.md
          test -s SECURITY.md
          test -s CHANGELOG.md
